name: Verify Shilevi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Database migrations and order flow
        run: npm run test:db
      - name: Production build
        run: npm run build
      - name: Route and header audit
        run: |
          npm run start -- -p 3100 > /tmp/shilevi-start.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/health || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then break; fi
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3100 npm run verify:routes
